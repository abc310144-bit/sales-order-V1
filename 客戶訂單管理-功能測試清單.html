<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      --ink: #1f1f1f;
      --muted: #595959;
      --line: #e6e6e6;
      --bg: #f5f6f8;
      --card: #fff;
      --accent: #1677ff;
      --ok: #389e0d;
      --ok-bg: #f6ffed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 16px 24px 12px;
    }
    h1 { margin: 0 0 4px; font-size: 20px; font-weight: 650; }
    .sub { margin: 0; color: var(--muted); font-size: 13px; }
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
    }
    .progress {
      flex: 1 1 220px;
      height: 8px;
      background: #f0f0f0;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress > span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--ok);
    }
    .count { font-weight: 650; min-width: 128px; }
    .filters, .tools { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 1px solid #d9d9d9;
      background: #fff;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }
    button.active { color: var(--accent); border-color: var(--accent); background: #e6f4ff; }
    button.danger { color: #cf1322; }
    main { max-width: 920px; margin: 0 auto; padding: 16px; }
    .note {
      background: #fffbe6;
      border: 1px solid #ffe58f;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .sec-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      padding: 12px 14px;
      background: #fafafa;
      border-bottom: 1px solid var(--line);
    }
    .sec-head h2 { margin: 0; font-size: 15px; }
    .sec-count { color: var(--muted); font-size: 13px; white-space: nowrap; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { border-top: 1px solid var(--line); }
    li:first-child { border-top: 0; }
    label.item {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
    }
    label.item:hover { background: #fafafa; }
    li.done label.item { background: var(--ok-bg); }
    input[type="checkbox"] { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--ok); }
    .title { font-size: 14px; }
    li.done .title { color: #135200; }
    .expect { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    li.hidden { display: none; }
    section.hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>客戶訂單管理｜功能測試清單</h1>
    <p class="sub">勾選存在這台瀏覽器。重新整理不會消失；換瀏覽器或清除網站資料才會重置。</p>
    <div class="bar">
      <div class="count" id="count">已測 0 / 0</div>
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
      <div class="filters" id="filters">
        <button type="button" class="active" data-filter="all">全部</button>
        <button type="button" data-filter="open">未測</button>
        <button type="button" data-filter="done">已測</button>
      </div>
      <div class="tools">
        <button type="button" id="copyBtn">複製進度</button>
        <button type="button" class="danger" id="resetBtn">清除全部勾選</button>
      </div>
    </div>
  </header>

          ["完成後鎖住出貨", "確定後狀態變已開立出貨單，列表完成說明顯示該段文字，不能再新增出貨單。"],
          ["其他狀態沒有此按鈕", "未開立出貨單、已開立出貨單不會出現確認完成。"]
        ]
      },
      {
        title: "12. 作廢",
        items: [
          ["待審核與已作廢不能作廢", "這兩種狀態的作廢是灰的。"],
          ["已有出貨單不可作廢", "客戶訂單已建立出貨單，且出貨單已拋單或狀態不是訂單取消時，列表作廢是灰的。例如部分出貨 SO20260826002（出貨單待驗收）、SO20260824006（含待拋單）。出貨單全部是訂單取消時，仍可作廢。"],
          ["其他狀態可作廢", "沒有未取消出貨單時才可作廢。視窗文案是「作廢客戶訂單將一併取消所有相應出貨單」。"],
          ["沒選原因不能確定", "沒選原因按確定，提示「請選擇作廢原因」。"],
          ["三個原因", "可選：庫存不足，不接收分批出貨；通路倉庫位置不足；其他。"],
          ["其他要另填 30 字內", "選其他後空白按確定，提示「請輸入作廢原因」。有填時最多 30 字。"],
          ["作廢後出貨單變訂單取消", "確定後訂單變已作廢，所屬出貨單變訂單取消，之後不再依出貨單把狀態改回去。"],
          ["列表顯示作廢說明", "列表作廢說明顯示所選原因；選其他則顯示自填文字。"]
        ]
      },
      {
        title: "13. 線上轉單換貨與批次出貨",
        items: [
          ["換貨出現條件", "只在線上-轉單，狀態是草稿、待審核或未開立出貨單，而且還沒有有效出貨單。建檔人與主管都可以。"],
          ["建立時不能換貨", "建立客戶訂單的精靈裡沒有換貨欄。草稿存檔後再打開，才看得到換貨。"],
          ["換貨內容檢查", "換貨至少一筆。SKU 須綁定線上-轉單，數量為正整數。效期_批號可選，沒選顯示先進先出。有空白列時按確定換貨會提示先刪除空白列。"],
          ["換貨金額須相等", "換貨是針對該品項。各換貨列合計加總必須等於原商品合計，超過或不足都不能按確定換貨。未按確定換貨就離開，不寫入這次修改。"],
          ["換貨效期", "換貨列可選效期_批號。沒選則出貨走先進先出；有選則出貨鎖定該批。"],
          ["結算用換貨商品", "已確定換貨後，結算品項與價格改用換貨商品。換貨合計等於原商品合計。"],
          ["已出貨不能換貨", "已有有效出貨單後，換貨與取消換貨都不可用。"],
          ["批次沒勾不能送", "沒勾可出貨的線上-轉單就按批次建立，提示「請先勾選可出貨的線上-轉單」。"],
          ["批次要選運送方式", "沒選運送方式，提示「請選擇運送方式」。選項有新竹物流、黑猫、全盛貨運(邱哥)、宅配通。"],
          ["批次依收件人開出貨單", "確定後，每張單把尚未出貨的商品依收件人各開出貨單，並提示建立張數。"]
        ]
      },
      {
        title: "14. 檢視鎖定",
        items: [
          ["非草稿不可改", "待審核以後的單，基本資料、下定商品、費用都不可改。"],
          ["費用頁籤出現條件", "費用頁籤只在檢視、且不是線上-轉單時出現。"],
          ["匯出按鈕", "經銷、境外在待回壓文件之後可匯出。境外按鈕文字是「匯出」，其餘是「匯出 PDF」。草稿與待審核不能匯出。"]
        ]
      }
    ];

    const saved = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
    const list = document.getElementById("list");
    let filter = "all";

    sections.forEach((section, si) => {
      const sec = document.createElement("section");
      sec.dataset.section = String(si);
      sec.innerHTML = `<div class="sec-head"><h2></h2><div class="sec-count"></div></div><ul></ul>`;
      sec.querySelector("h2").textContent = section.title;
      const ul = sec.querySelector("ul");
      section.items.forEach((item, ii) => {
        const id = `s${si + 1}-${String(ii + 1).padStart(2, "0")}`;
        const li = document.createElement("li");
        li.dataset.id = id;
        li.dataset.title = item[0];
        li.dataset.expect = item[1];
        li.dataset.section = section.title;
        if (saved.has(id)) li.classList.add("done");
        li.innerHTML = `<label class="item"><input type="checkbox" /><span><span class="title"></span><span class="expect"></span></span></label>`;
        const box = li.querySelector("input");
        box.checked = saved.has(id);
        li.querySelector(".title").textContent = item[0];
        li.querySelector(".expect").textContent = item[1];
        box.addEventListener("change", () => {
          li.classList.toggle("done", box.checked);
          if (box.checked) saved.add(id);
          else saved.delete(id);
          localStorage.setItem(KEY, JSON.stringify([...saved]));
          paint();
        });
        ul.appendChild(li);
      });
      list.appendChild(sec);
    });

    function paint() {
      const rows = [...document.querySelectorAll("li")];
      const done = rows.filter((li) => li.classList.contains("done")).length;
      document.getElementById("count").textContent = `已測 ${done} / ${rows.length}`;
      document.getElementById("bar").style.width = `${rows.length ? (done / rows.length) * 100 : 0}%`;
      document.querySelectorAll("section").forEach((sec) => {
        const items = [...sec.querySelectorAll("li")];
        const n = items.filter((li) => li.classList.contains("done")).length;
        sec.querySelector(".sec-count").textContent = `${n} / ${items.length}`;
        let visible = 0;
        items.forEach((li) => {
          const show = filter === "all" || (filter === "done" ? li.classList.contains("done") : !li.classList.contains("done"));
          li.classList.toggle("hidden", !show);
          if (show) visible += 1;
        });
        sec.classList.toggle("hidden", visible === 0);
      });
    }

    document.getElementById("filters").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      filter = btn.dataset.filter;
      document.querySelectorAll("#filters button").forEach((el) => el.classList.toggle("active", el === btn));
      paint();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!saved.size) return;
      if (!confirm("清除全部勾選？已測紀錄會從這台瀏覽器刪除。")) return;
      saved.clear();
      localStorage.removeItem(KEY);
      document.querySelectorAll("li").forEach((li) => {
        li.classList.remove("done");
        li.querySelector("input").checked = false;
      });
      paint();
    });

    document.getElementById("copyBtn").addEventListener("click", async () => {
      const lines = ["客戶訂單管理功能測試進度", ""];
      document.querySelectorAll("section").forEach((sec) => {
        lines.push(sec.querySelector("h2").textContent);
        sec.querySelectorAll("li").forEach((li) => {
          lines.push(`${li.classList.contains("done") ? "[x]" : "[ ]"} ${li.dataset.title}`);
        });
        lines.push("");
      });
      const text = lines.join("\n");
      try {
        await navigator.clipboard.writeText(text);
        document.getElementById("copyBtn").textContent = "已複製";
      } catch (err) {
        document.getElementById("copyBtn").textContent = "複製失敗";
      }
      setTimeout(() => { document.getElementById("copyBtn").textContent = "複製進度"; }, 1200);
    });

    paint();
  </script>
</body>
</html>
